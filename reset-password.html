<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Réinitialiser le mot de passe — JAYPEE</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="adm-login-shell">
  <div class="adm-login-card">
    <div class="adm-login-logo" style="text-align:center;margin-bottom:18px">
      <img src="images/jaypee-logo.png" alt="JAYPEE" height="42"/>
    </div>

    <div class="adm-login-ttl">Nouveau mot de passe</div>
    <div class="adm-login-sub" id="rpSub">Choisissez un nouveau mot de passe admin</div>
    <div class="adm-login-err" id="rpErr"></div>
    <div class="adm-login-err" id="rpOk" style="background:#e8f5e9;color:#2e7d32;border-left-color:#2e7d32"></div>

    <form id="rpForm">
      <div class="af-fld" style="margin-bottom:14px">
        <label class="af-lbl">Nouveau mot de passe</label>
        <input class="af-inp" type="password" id="rpPassword" required minlength="8" autocomplete="new-password"/>
      </div>
      <div class="af-fld">
        <label class="af-lbl">Confirmer le mot de passe</label>
        <input class="af-inp" type="password" id="rpPassword2" required minlength="8" autocomplete="new-password"/>
      </div>
      <button class="adm-login-btn" type="submit" id="rpBtn">Mettre à jour le mot de passe</button>
    </form>

    <div style="text-align:center;margin-top:18px">
      <a href="admin.html" style="font-family:var(--caps);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)">← Retour à l'espace admin</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/supabase-config.js"></script>
<script>
const rpForm = document.getElementById('rpForm');
const rpBtn = document.getElementById('rpBtn');
const rpErr = document.getElementById('rpErr');
const rpOk = document.getElementById('rpOk');
const rpSub = document.getElementById('rpSub');

function showErr(msg) {
  rpErr.textContent = msg;
  rpErr.classList.add('show');
}

let recoveryReady = false;

// Le lien de récupération Supabase renvoie les tokens dans le hash (#access_token=...&type=recovery)
// supabase-js les détecte automatiquement au chargement et émet l'événement PASSWORD_RECOVERY.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryReady = true;
    rpSub.textContent = 'Choisissez un nouveau mot de passe admin';
  }
});

// Si l'utilisateur arrive avec un lien déjà expiré/invalide, Supabase met une erreur dans le hash.
if (window.location.hash.includes('error=')) {
  const params = new URLSearchParams(window.location.hash.slice(1));
  showErr(params.get('error_description') ? decodeURIComponent(params.get('error_description').replace(/\+/g, ' ')) : "Lien invalide ou expiré. Demandez un nouveau lien de réinitialisation.");
  rpForm.style.display = 'none';
}

rpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  rpErr.classList.remove('show');
  rpOk.classList.remove('show');

  const pw1 = document.getElementById('rpPassword').value;
  const pw2 = document.getElementById('rpPassword2').value;

  if (pw1 !== pw2) {
    showErr("Les deux mots de passe ne correspondent pas.");
    return;
  }
  if (!recoveryReady) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      showErr("Lien de réinitialisation manquant ou expiré. Redemandez un email depuis le dashboard Supabase.");
      return;
    }
  }

  rpBtn.disabled = true;
  rpBtn.innerHTML = '<span class="adm-spin"></span> Mise à jour…';

  const { error } = await sb.auth.updateUser({ password: pw1 });

  rpBtn.disabled = false;
  rpBtn.textContent = 'Mettre à jour le mot de passe';

  if (error) {
    showErr(error.message);
    return;
  }

  rpOk.textContent = "Mot de passe mis à jour ! Redirection vers l'espace admin…";
  rpOk.classList.add('show');
  rpForm.style.display = 'none';
  setTimeout(() => { window.location.href = 'admin.html'; }, 1800);
});
</script>
</body>
</html>
